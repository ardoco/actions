name: OpenWiki Update

on:
  workflow_call:
    inputs:
        branch:
          description: "The branch that is checked for recent commits and that OpenWiki documents."
          type: string
          required: false
          default: "main"
        lookback-days:
          description: "Only update when the branch received relevant commits within this many days. Should match the schedule of the calling workflow."
          type: number
          required: false
          default: 7
        node-version:
          description: "The Node.js version used to run OpenWiki."
          type: string
          required: false
          default: "22"
        model-id:
          description: "The OpenRouter model id that OpenWiki uses to generate the documentation."
          type: string
          required: false
          default: "z-ai/glm-5.2"
        runs-on:
          description: "Tag for the runner to use in the main job."
          type: string
          required: false
          default: "ubuntu-latest"

    secrets:
      OPENROUTER_API_KEY:
        required: true

# The calling workflow must not restrict these permissions any further.
# A called workflow can only downgrade the token of its caller, never elevate it.
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Check for recent commits
        id: recent_commits
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
          LOOKBACK_DAYS: ${{ inputs.lookback-days }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" --quiet
          TOTAL_COUNT=$(git rev-list --count --since="$LOOKBACK_DAYS days ago" "origin/$BRANCH")
          RELEVANT_COUNT=$(git rev-list --count --since="$LOOKBACK_DAYS days ago" "origin/$BRANCH" -- . ':(exclude)openwiki/**')
          echo "count=$RELEVANT_COUNT" >> "$GITHUB_OUTPUT"
          echo "total_count=$TOTAL_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$RELEVANT_COUNT" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Detected $RELEVANT_COUNT relevant commit(s) on $BRANCH in last $LOOKBACK_DAYS days (total commits: $TOTAL_COUNT)."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No relevant commits on $BRANCH in last $LOOKBACK_DAYS days (ignoring openwiki/** updates; total commits: $TOTAL_COUNT)."
          fi

      - name: Stop early when no changes
        if: steps.recent_commits.outputs.changed != 'true'
        run: echo "Skipping OpenWiki update because ${{ inputs.branch }} has no relevant recent commits (openwiki/** only changes are ignored)."

      - name: Set up Node.js
        if: steps.recent_commits.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install OpenWiki
        if: steps.recent_commits.outputs.changed == 'true'
        run: npm install --global openwiki mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        if: steps.recent_commits.outputs.changed == 'true'
        run: openwiki --update --print
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: ${{ inputs.model-id }}
          OPENWIKI_PROVIDER: openrouter
          OPENWIKI_TELEMETRY_DISABLED: "1"
        
      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Create OpenWiki update pull request
        if: steps.recent_commits.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          base: ${{ inputs.branch }}
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            When the result is `failure`, this PR intentionally preserves only the
            pages completed before the failure. Merge it to make that progress the
            baseline for the next scheduled run.
            
      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
